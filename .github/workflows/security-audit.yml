name: Security audit

on:
  pull_request:
  push:
    branches: [development, main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit backend dependencies
        id: audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt
      - name: Report audit status
        if: always() && steps.audit.outcome == 'failure'
        run: echo "::warning::Backend dependency audit found issues (non-blocking). Seguimiento en el tiquete del plan de seguridad, P1."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Audit frontend production dependencies
        id: audit-frontend
        continue-on-error: true
        run: pnpm audit --prod
        working-directory: frontend
      - name: Report frontend audit status
        if: steps.audit-frontend.outcome == 'failure'
        run: echo "::warning::Frontend dependency audit found issues (non-blocking). Seguimiento en el tiquete del plan de seguridad, P1."